<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Result</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Container matching the background globe mesh and exact padding */
    .verification-card {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10% 12%;
      background-color: #ffffff;
      /* Dynamic light purple/blue linear radial wireframe mesh */
      background-image: 
        radial-gradient(ellipse at 70% 40%, rgba(138, 128, 206, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 30% 70%, rgba(91, 189, 232, 0.10) 0%, transparent 70%);
      background-size: cover;
      background-position: center;
    }

    /* Verified Badge Header */
    .verified-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 45px;
    }

    .verified-header svg {
      width: 52px;
      height: 52px;
    }

    .verified-title {
      font-size: 48px;
      font-weight: 700;
      color: #1c2b66; /* Exact dark purple-blue brand color */
      letter-spacing: -0.5px;
    }

    /* Text Block Styling */
    .text-block {
      font-size: 16px;
      color: #555555;
      line-height: 2.2;
    }

    .candidate-name {
      font-weight: bold;
      color: #222222;
    }

    .qualification-title {
      color: #666666;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="verification-card">
    
    <!-- Verified Logo + Checkmark Badge -->
    <div class="verified-header">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="#00b060" />
        <path d="M28 50 L42 64 L72 34" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="verified-title">Verified</span>
    </div>

    <!-- Verification Details -->
    <div class="text-block">
      <p><span class="candidate-name">Matee Ur Rehman</span> has achieved</p>
      <p class="qualification-title">603/3106/9 ProQual Level 6 NVQ Diploma in Occupational Health and Safety Practice</p>
    </div>

  </div>

</body>
</html>
